# The six FastAPI services. They share one shape on purpose (same probes, env layout, labels);
# only image, resources, readiness path and extra env differ.
# Liveness = /health (no dependencies), readiness = /ready (Postgres reachable) where it exists.
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: {app: api-gateway}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api-gateway
          image: mlops/api-gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: PYTHONPATH, value: /app}
            - {name: SERVICE_NAME, value: api-gateway}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: mlops-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mlops-secrets, key: POSTGRES_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/mlops_platform"}
            - {name: DATASET_SERVICE_URL, value: "http://dataset-service:8000"}
            - {name: TRAINING_SERVICE_URL, value: "http://training-service:8000"}
            - {name: DEPLOYMENT_SERVICE_URL, value: "http://deployment-service:8000"}
            - {name: MONITORING_SERVICE_URL, value: "http://monitoring-service:8000"}
            - {name: AI_SERVICE_URL, value: "http://ai-service:8000"}
            - name: JWT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: mlops-secrets, key: JWT_SECRET_KEY}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: mlops-secrets, key: ADMIN_PASSWORD}}
            - {name: MLFLOW_URL, value: "http://mlflow:5000"}
            - {name: PROMETHEUS_URL, value: "http://prometheus:9090"}
            - {name: CORS_EXTRA_ORIGINS, value: "http://localhost:13000,http://127.0.0.1:13000"}
          startupProbe:          # imports (sklearn, mlflow, shap) take a while on a cold pod
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "500m", memory: 384Mi}
