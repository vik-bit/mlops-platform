apiVersion: v1
kind: Service
metadata:
  name: deployment-service
spec:
  selector: {app: deployment-service}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: deployment-service}
  template:
    metadata:
      labels: {app: deployment-service}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: deployment-service
          image: mlops/deployment-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: PYTHONPATH, value: /app}
            - {name: SERVICE_NAME, value: deployment-service}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: mlops-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: mlops-secrets, key: POSTGRES_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/mlops_platform"}
            - {name: DATASET_SERVICE_URL, value: "http://dataset-service:8000"}
            - {name: TRAINING_SERVICE_URL, value: "http://training-service:8000"}
            - {name: MONITORING_SERVICE_URL, value: "http://monitoring-service:8000"}
            - {name: AI_SERVICE_URL, value: "http://ai-service:8000"}
            - {name: ROLLOUT_EVAL_INTERVAL_S, value: "2"}
            - {name: ROUTING_TTL_S, value: "1"}
            - {name: LOG_FLUSH_INTERVAL_S, value: "0.5"}
          startupProbe:          # imports (sklearn, mlflow, shap) take a while on a cold pod
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
