# Local Kind cluster: base manifests + metrics-server (for the HPA) + NodePorts mapped to the host.
# Secrets come from secrets.env (gitignored); scripts/kind-up.sh generates random values.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops
resources:
  - ../base
  - nodeports.yaml
secretGenerator:
  - name: mlops-secrets
    envs: [secrets.env]
generatorOptions:
  disableNameSuffixHash: true
