services:
  api-gateway:
    build:
      context: .
      dockerfile: ./backend/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/api-gateway/app:/app/app
      - ./shared:/app/shared
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis

  dataset-service:
    build:
      context: .
      dockerfile: ./backend/dataset-service/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./backend/dataset-service/app:/app/app
      - ./shared:/app/shared
      - ./datasets:/app/datasets
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres

  training-service:
    build:
      context: .
      dockerfile: ./backend/training-service/Dockerfile
    ports:
      - "8002:8000"
    volumes:
    - ./backend/training-service:/app
    - ./shared:/app/shared
    - ./datasets:/app/datasets
    - ./saved_models:/app/saved_models
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis
      - mlflow

  deployment-service:
    build:
      context: .
      dockerfile: ./backend/deployment-service/Dockerfile
    ports:
      - "8003:8000"
    volumes:
      - ./backend/deployment-service/app:/app/app
      - ./shared:/app/shared
      - ./saved_models:/app/saved_models
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres

  monitoring-service:
    build:
      context: .
      dockerfile: ./backend/monitoring-service/Dockerfile
    ports:
      - "8004:8000"
    volumes:
      - ./backend/monitoring-service/app:/app/app
      - ./shared:/app/shared
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mlops_platform
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: mlops-redis
    ports:
      - "6379:6379"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
 
  prometheus:
    image: prom/prometheus

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - monitoring-service


  grafana:
    image: grafana/grafana

    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus