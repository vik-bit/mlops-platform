name: Keep Services Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Warm entire platform
        run: |
          curl -f -sS \
            --max-time 120 \
            https://mlops-api-gateway.onrender.com/warmup