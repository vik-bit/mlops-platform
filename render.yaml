databases:
  - name: mlops-postgres
    plan: free
    databaseName: mlops_platform
    user: admin

services:
  # ── API Gateway ──────────────────────────────────────────────────────────────
  - type: web
    name: mlops-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
      - key: DATASET_SERVICE_URL
        value: https://mlops-dataset-service.onrender.com
      - key: TRAINING_SERVICE_URL
        value: https://mlops-training-service.onrender.com
      - key: DEPLOYMENT_SERVICE_URL
        value: https://mlops-deployment-service.onrender.com
      - key: MONITORING_SERVICE_URL
        value: https://mlops-monitoring-service.onrender.com
      - key: AI_SERVICE_URL
        value: https://mlops-ai-service.onrender.com
    healthCheckPath: /health

  # ── Dataset Service ───────────────────────────────────────────────────────────
  - type: web
    name: mlops-dataset-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/dataset-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
    healthCheckPath: /health

  # ── Training Service ──────────────────────────────────────────────────────────
  - type: web
    name: mlops-training-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/training-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
      - key: DATASET_SERVICE_URL
        value: https://mlops-dataset-service.onrender.com
      - key: MLFLOW_URL
        value: https://mlops-mlflow-cxbz.onrender.com
    healthCheckPath: /health

  # ── Deployment Service ────────────────────────────────────────────────────────
  - type: web
    name: mlops-deployment-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/deployment-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
      - key: MONITORING_SERVICE_URL
        value: https://mlops-monitoring-service.onrender.com
    healthCheckPath: /health

  # ── Monitoring Service ─────────────────────────────────────────────────────────
  - type: web
    name: mlops-monitoring-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/monitoring-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
    healthCheckPath: /health

  # ── AI Service (Groq) ──────────────────────────────────────────────────────────
  - type: web
    name: mlops-ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/ai-service/Dockerfile
    dockerContext: .
    envVars:
      - key: SERVICE_NAME
        value: ai-service
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: LLM_TIMEOUT
        value: "120"
      - key: DEPLOYMENT_SERVICE_URL
        value: https://mlops-deployment-service.onrender.com
      - key: MONITORING_SERVICE_URL
        value: https://mlops-monitoring-service.onrender.com
      - key: TRAINING_SERVICE_URL
        value: https://mlops-training-service.onrender.com
      - key: MLFLOW_URL
        value: https://mlops-mlflow-cxbz.onrender.com
      - key: PROMETHEUS_URL
        value: https://mlops-prometheus.onrender.com
    healthCheckPath: /health

  # ── MLflow ────────────────────────────────────────────────────────────────────
  - type: web
    name: mlops-mlflow
    runtime: image
    plan: free
    image:
      url: ghcr.io/mlflow/mlflow:v2.12.1
    dockerCommand: mlflow server --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: "10000"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  - type: web
    name: mlops-prometheus
    runtime: image
    plan: free
    image:
      url: prom/prometheus:latest

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────────
  - type: web
    name: mlops-frontend
    runtime: node
    plan: free
    rootDir: frontend/vertex-ai-frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://mlops-api-gateway.onrender.com
      - key: NEXT_PUBLIC_COPILOT_BASE_URL
        value: https://mlops-api-gateway.onrender.com/api/copilot