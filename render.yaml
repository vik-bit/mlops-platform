services:
  api-gateway:
    build:
      context: .
      dockerfile: ./backend/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/api-gateway/app:/app/app
      - ./shared:/app/shared
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis
    networks:
      - mlops_network

  dataset-service:
    build:
      context: .
      dockerfile: ./backend/dataset-service/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./backend/dataset-service/app:/app/app
      - ./shared:/app/shared
      - ./datasets:/app/datasets
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
    networks:
      - mlops_network

  training-service:
    build:
      context: .
      dockerfile: ./backend/training-service/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - ./backend/training-service:/app
      - ./shared:/app/shared
      - ./datasets:/app/datasets
      - ./saved_models:/app/saved_models
    environment:
      - PYTHONPATH=/app
    networks:
      - mlops_network
    depends_on:
      - postgres
      - redis
      - mlflow

  deployment-service:
    build:
      context: .
      dockerfile: ./backend/deployment-service/Dockerfile
    ports:
      - "8003:8000"
    volumes:
      - ./backend/deployment-service/app:/app/app
      - ./shared:/app/shared
      - ./saved_models:/app/saved_models
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
    networks:
      - mlops_network

  monitoring-service:
    build:
      context: .
      dockerfile: ./backend/monitoring-service/Dockerfile
    ports:
      - "8004:8000"
    volumes:
      - ./backend/monitoring-service/app:/app/app
      - ./shared:/app/shared
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
    networks:
      - mlops_network

  postgres:
    image: postgres:16
    networks:
      - mlops_network
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mlops_platform
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: mlops-redis
    ports:
      - "6379:6379"
    networks:
      - mlops_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: mlops-mlflow
    ports:
      - "5000:5000"
    networks:
      - mlops_network
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000

  prometheus:
    networks:
      - mlops_network
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - monitoring-service

  ai-service:
    build:
      context: .
      dockerfile: ./backend/ai-service/Dockerfile
    container_name: mlops_ai_service
    env_file:
      - .env
    environment:
      SERVICE_NAME: "ai-service"
      ENVIRONMENT: "production"

      LLM_PROVIDER: "groq"
      LLM_MODEL: "llama-3.3-70b-versatile"
      LLM_TEMPERATURE: "0.3"
      LLM_MAX_TOKENS: "2048"
      LLM_TIMEOUT: "120"

      DEPLOYMENT_SERVICE_URL: "http://deployment-service:8000"
      MONITORING_SERVICE_URL: "http://monitoring-service:8000"
      TRAINING_SERVICE_URL: "http://training-service:8000"
      MLFLOW_URL: "http://mlflow:5000"
      PROMETHEUS_URL: "http://prometheus:9090"
    ports:
      - "8005:8000"
    networks:
      - mlops_network
    restart: unless-stopped
    depends_on:
      - training-service
      - deployment-service
      - monitoring-service
      - mlflow
      - prometheus
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  mlops_network: