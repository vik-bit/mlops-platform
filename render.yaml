databases:
  - name: mlops-postgres
    plan: free
    databaseName: mlops_platform
    user: admin

services:
  # ── API Gateway ──────────────────────────────────────────────────────────────
  - type: web
    name: mlops-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: JWT_SECRET_KEY
        sync: false  # set manually in Render dashboard — never in this file
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
      # FIX: fromService + hostport returns a bare "name:port" string with
      # no scheme — that's the literal cause of "URL scheme is not supported"
      # errors in any client (fetch, httpx, requests) reading these vars.
      # Render free-tier services communicate over the public internet using
      # the predictable https://<service-name>.onrender.com pattern, so we
      # set that directly as a plain string instead of relying on fromService.
      #
      # CONFIRMED against Render dashboard — exact match to the bare
      # service name pattern, no random suffix appended.
      - key: DATASET_SERVICE_URL
        value: https://mlops-dataset-service.onrender.com
      - key: TRAINING_SERVICE_URL
        value: https://mlops-training-service.onrender.com
      - key: DEPLOYMENT_SERVICE_URL
        value: https://mlops-deployment-service.onrender.com
      - key: MONITORING_SERVICE_URL
        value: https://mlops-monitoring-service.onrender.com
      - key: AI_SERVICE_URL
        value: https://mlops-ai-service.onrender.com
    healthCheckPath: /health

  # ── Dataset Service ───────────────────────────────────────────────────────────
  - type: web
    name: mlops-dataset-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/dataset-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
    healthCheckPath: /health

  # ── Training Service ──────────────────────────────────────────────────────────
  - type: web
    name: mlops-training-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/training-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
      # FIX: same hostport scheme issue — MLflow's own server URL also
      # needs an explicit scheme or the MLflow client inside training.py
      # will fail to connect the same way the frontend failed to fetch.
      # CONFIRMED — image-runtime services get a random Render suffix,
      # unlike the docker-runtime services above which kept bare names.
      - key: MLFLOW_URL
        value: https://mlops-mlflow-cxbz.onrender.com
    healthCheckPath: /health

  # ── Deployment Service ────────────────────────────────────────────────────────
  - type: web
    name: mlops-deployment-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/deployment-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
    healthCheckPath: /health

  # ── Monitoring Service ─────────────────────────────────────────────────────────
  - type: web
    name: mlops-monitoring-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/monitoring-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
    healthCheckPath: /health

  # ── AI Service (Groq) ──────────────────────────────────────────────────────────
  - type: web
    name: mlops-ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/ai-service/Dockerfile
    dockerContext: .
    envVars:
      - key: SERVICE_NAME
        value: ai-service
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false  # set manually in Render dashboard — never in this file
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: LLM_TIMEOUT
        value: "120"
      # CONFIRMED against Render dashboard
      - key: DEPLOYMENT_SERVICE_URL
        value: https://mlops-deployment-service.onrender.com
      - key: MONITORING_SERVICE_URL
        value: https://mlops-monitoring-service.onrender.com
      - key: TRAINING_SERVICE_URL
        value: https://mlops-training-service.onrender.com
      - key: MLFLOW_URL
        value: https://mlops-mlflow-cxbz.onrender.com  # CONFIRMED — image-runtime services get a random suffix
      - key: PROMETHEUS_URL
        value: https://mlops-prometheus.onrender.com  # CONFIRMED
    healthCheckPath: /health

  # ── MLflow ────────────────────────────────────────────────────────────────────
  - type: web
    name: mlops-mlflow
    runtime: image
    plan: free
    image:
      url: ghcr.io/mlflow/mlflow:v2.12.1
    dockerCommand: mlflow server --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: "10000"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  - type: web
    name: mlops-prometheus
    runtime: image
    plan: free
    image:
      url: prom/prometheus:latest
    # See render-deploy-notes.md — Render can't bind-mount a local
    # prometheus.yml into a stock image; bake it into a custom Dockerfile
    # instead (Option B in the notes) if you need a real scrape config.

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────────
  - type: web
    name: mlops-frontend
    runtime: node
    plan: free
    rootDir: frontend/vertex-ai-frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # FIX: this was the exact source of your error. NEXT_PUBLIC_API_BASE_URL
      # was being set to a bare "mlops-api-gateway:8000" string with no
      # scheme via fromService/hostport. api.ts does:
      #   const BASE = process.env.NEXT_PUBLIC_API_BASE_URL ?? 'http://localhost:8000'
      #   fetch(`${BASE}${path}`)
      # with nothing prepending http:// or https://, so the browser tried
      # to fetch a URL with scheme "mlops-api-gateway" — which doesn't exist
      # as a URI scheme, hence "URL scheme is not supported".
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://mlops-api-gateway.onrender.com
      # Set this too if the copilot chat page calls a separate base URL —
      # check app/copilot/page.tsx or chat-panel.tsx for COPILOT_BASE/API_URL
      # and point it at the gateway or ai-service the same way.
      - key: NEXT_PUBLIC_COPILOT_BASE_URL
        value: https://mlops-api-gateway.onrender.com/api/copilot