databases:
  - name: mlops-postgres
    plan: free
    databaseName: mlops_platform
    user: admin

services:
  # ── API Gateway ──────────────────────────────────────────────────────────────
  - type: web
    name: mlops-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: JWT_SECRET_KEY
        sync: false  # set manually in Render dashboard — never in this file
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
      - key: DATASET_SERVICE_URL
        fromService:
          type: web
          name: mlops-dataset-service
          property: hostport
      - key: TRAINING_SERVICE_URL
        fromService:
          type: web
          name: mlops-training-service
          property: hostport
      - key: DEPLOYMENT_SERVICE_URL
        fromService:
          type: web
          name: mlops-deployment-service
          property: hostport
      - key: MONITORING_SERVICE_URL
        fromService:
          type: web
          name: mlops-monitoring-service
          property: hostport
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: mlops-ai-service
          property: hostport
    healthCheckPath: /health

  # ── Dataset Service ───────────────────────────────────────────────────────────
  - type: web
    name: mlops-dataset-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/dataset-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
    healthCheckPath: /health

  # ── Training Service ──────────────────────────────────────────────────────────
  - type: web
    name: mlops-training-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/training-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
      - key: MLFLOW_URL
        fromService:
          type: web
          name: mlops-mlflow
          property: hostport
    healthCheckPath: /health

  # ── Deployment Service ────────────────────────────────────────────────────────
  - type: web
    name: mlops-deployment-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/deployment-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
    healthCheckPath: /health

  # ── Monitoring Service ─────────────────────────────────────────────────────────
  - type: web
    name: mlops-monitoring-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/monitoring-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-postgres
          property: connectionString
    healthCheckPath: /health

  # ── AI Service (Groq) ──────────────────────────────────────────────────────────
  - type: web
    name: mlops-ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend/ai-service/Dockerfile
    dockerContext: .
    envVars:
      - key: SERVICE_NAME
        value: ai-service
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false  # set manually in Render dashboard — never in this file
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: LLM_TIMEOUT
        value: "120"
      - key: DEPLOYMENT_SERVICE_URL
        fromService:
          type: web
          name: mlops-deployment-service
          property: hostport
      - key: MONITORING_SERVICE_URL
        fromService:
          type: web
          name: mlops-monitoring-service
          property: hostport
      - key: TRAINING_SERVICE_URL
        fromService:
          type: web
          name: mlops-training-service
          property: hostport
      - key: MLFLOW_URL
        fromService:
          type: web
          name: mlops-mlflow
          property: hostport
      - key: PROMETHEUS_URL
        fromService:
          type: web
          name: mlops-prometheus
          property: hostport
    healthCheckPath: /health

  # ── MLflow ────────────────────────────────────────────────────────────────────
  - type: web
    name: mlops-mlflow
    runtime: docker
    plan: free
    image:
      url: ghcr.io/mlflow/mlflow:v2.12.1
    dockerCommand: mlflow server --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: "10000"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  - type: web
    name: mlops-prometheus
    runtime: docker
    plan: free
    image:
      url: prom/prometheus:latest
    # NOTE: Render's free tier has no persistent volume mount for images deployed
    # this way, and prometheus.yml must be baked into a custom image instead of
    # mounted, since Render can't bind-mount a local file into a stock image.
    # See render-deploy-notes.md for the two ways to handle this.

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────────
  - type: web
    name: mlops-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: mlops-api-gateway
          property: hostport